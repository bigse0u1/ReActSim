world: fake            # fake | maniskill
seed: 0
max_steps: 20
max_replans: 4

maniskill:
  env_id: ReActTabletop-v1
  scene: kitchen           # kitchen (banana, mug, can) | home (orange, can, cup)
  robot: panda             # panda (two-finger gripper) | hand (xArm7 + five-finger Ability hand)
  render_mode: rgb_array   # human for GUI
  sim_backend: cpu
  record_video: true

perception:
  segmenter: oracle        # oracle | sam3
  sam_model: sam-3.1

planning:
  planner: muse            # muse | rule | fixed
  model: muse-spark-1.3
  temperature: 0.2
  max_invalid_retries: 2

imagination:
  enabled: true
  max_candidates: 3

chaos:
  enabled: true
  # Scripted events for reproducible benchmarks: {step: N, event: {...}}
  scripted:
    - step: 0
      event: {kind: knock, object: target, dx: -0.08, dy: 0.0}   # "target" = the goal object

viz:
  rerun: false
